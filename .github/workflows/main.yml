name: Binaries

on: # Workflow triggers on both when a commit is pushed, or when a pull request is made.
    push:
        branches: 
            - dev
    pull_request:
        branches:
            - dev
    
    workflow_dispatch: # Run workflow manually from the actions tab.
    workflow_call: #For release builds
        inputs:
            buildFlags:
                required: false
                type: string

env:
    HAXE_VERSION: 4.3.7
    HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache
    LIME_HASH: 6421de16b9dfa4fb55c19f12db65d392a57585c8


jobs: # FUCK MY LIFE BROOOOO
    Windows:
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v7
              with:
                submodules: true
            - uses: krdlab/setup-haxe@v2.1.0

              with: 
                haxe-version: ${{ env.HAXE_VERSION }}

            - name: Install libs
              shell: pwsh
              run: |
                function Run {
                  $exe = $args[0]
                  $cmdArgs = @()
                  if ($args.Length -gt 1) {
                    $cmdArgs = $args[1..($args.Length - 1)]
                  }
                  Write-Host ">>> $exe $($cmdArgs -join ' ')"
                  & $exe @cmdArgs
                  if ($LASTEXITCODE -ne 0) {
                    Write-Error "Command failed with exit code ${LASTEXITCODE}: $exe $($cmdArgs -join ' ')"
                    exit $LASTEXITCODE
                  }
                }
                Run haxelib setup C:/haxelib
                Run haxelib install hxpkg --quiet
                Run haxelib run hxpkg install
                  haxelib run lime config ANDROID_SDK $ANDROID_HOME
                  haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
                  haxelib run lime config JAVA_HOME $JAVA_HOME_21_arm64
                  haxelib run lime config ANDROID_SETUP true
                Run haxelib path lime
                Run haxelib run lime rebuild cpp -release
                
                
            - name: Compile build
              run: xcopy D:\a\NightmareVision\NightmareVision\.haxelib D:\a\NightmareVision\NightmareVision\projFiles /S /E /Y
            - name: Publish artifact
              uses: actions/upload-artifact@v7.0.1
              with:
                name: NightmareVision (Windows)
                path: projFiles
